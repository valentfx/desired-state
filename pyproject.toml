[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desired-state"
version = "0.1.0"
description = "Local-first biofeedback acquisition prototype"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22,<4"]

[project.scripts]
desired-state-h10 = "desired_state.platforms.raspberry_pi.collect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
